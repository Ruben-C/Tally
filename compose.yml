# Tally — self-hosted personal finance PWA over Plaid.
#
# One app container plus its own Postgres. To run it:
#   1. cp .env.example .env and fill it in,
#   2. docker compose up -d --build
#   3. docker compose exec -T tally node src/setup-code.js --hours 24   (one-time link to register a passkey)
#
# By default the app is published on 127.0.0.1:3000 (http://localhost:3000). To serve it on a domain, put an HTTPS
# reverse proxy in front, set RP_ID / ORIGIN in .env, and change TALLY_BIND if the proxy runs elsewhere.
name: tally
services:
  tally:
    build: .
    container_name: tally
    restart: unless-stopped
    # Must own ./data: set PUID / PGID in .env to `id -u` / `id -g` if yours aren't 1000.
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "3000"
      DATABASE_URL: postgres://tally:${POSTGRES_PASSWORD}@db:5432/tally
    ports:
      - "${TALLY_BIND:-127.0.0.1:3000}:3000"
    volumes:
      - ./data/app:/data
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    networks: [internal]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      POSTGRES_USER: tally
      POSTGRES_DB: tally
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally -d tally"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 128m
    mem_limit: 512m
    networks: [internal]   # never on a shared network; only the app talks to the database

networks:
  internal: {}
